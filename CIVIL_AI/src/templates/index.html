<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CIVIL AI - AI-Powered Civil Engineering Assistant</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <nav class="sidebar">
            <div class="logo">
                <h1>CIVIL AI</h1>
            </div>
            <ul class="nav-links">
                <li class="active"><a href="#"><i class="fas fa-comment-alt"></i> Chat</a></li>
                <li><a href="#"><i class="fas fa-pen-nib"></i> Assignment Solver</a></li>
                <li><a href="#"><i class="fas fa-file-pdf"></i> OCR / PDF</a></li>
                <li><a href="#"><i class="fas fa-lightbulb"></i> Project Ideas</a></li>
            </ul>
            <div class="history-panel">
                <h3>History</h3>
                <div id="chat-history"></div>
            </div>
            <div class="auth-section">
                <button id="auth-btn" class="btn-auth">Login / Signup</button>
                <div id="user-info" style="display:none;">
                    <span id="user-email"></span>
                    <button id="logout-btn" class="btn-small">Logout</button>
                </div>
            </div>
        </nav>

        <main class="main-content">
            <header class="top-bar">
                <h2>Civil Engineering Assistant</h2>
                <div class="top-actions">
                    <select id="language-select">
                        <option value="en">English</option>
                        <option value="hi">Hindi</option>
                    </select>
                </div>
            </header>

            <div class="chat-area">
                <div id="chat-window">
                    <div class="message output-message bot-message">
                        Hello! Welcome to CIVIL AI. I can assist you with Civil QA, assignment solving, OCR analysis, and more. How can I help you today?
                    </div>
                </div>
                <div class="upload-preview" id="upload-preview" style="display:none;"></div>
            </div>

            <footer class="input-area">
                <button class="icon-btn" id="upload-btn"><i class="fas fa-paperclip"></i></button>
                <input type="file" id="file-input" style="display:none;" accept="image/*,.pdf">
                <textarea id="search-input" placeholder="Ask a question, enter assignment description, or describe diagram..."></textarea>
                <button class="icon-btn" id="voice-btn"><i class="fas fa-microphone"></i></button>
                <button class="icon-btn send-btn" id="send-btn"><i class="fas fa-paper-plane"></i></button>
            </footer>
        </main>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js"></script>

    <!-- Custom JS -->
    <script src="/static/js/main.js"></script>
</body>
</html>
